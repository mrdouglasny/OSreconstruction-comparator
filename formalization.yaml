#
# Thin Comparator wrapper for xiyin137/OSreconstruction (Lake project os-reconstruction/).
# This repository contains no mathematics of its own: RegistryChallenge.lean is the package's
# Mathlib-only Definitions.lean reproduced verbatim plus the three theorem holes, and
# RegistrySolution.lean discharges them from the package through its bridge equivalences.
#
# Lake dependency vs. substantive source: lakefile.toml requires mrdouglasny/os-reconstruction,
# a root-level mirror of the os-reconstruction/ directory of the substantive repository at the
# commit named below, produced by `git subtree split --prefix=os-reconstruction`. Its tree hash
# equals that directory's tree hash (2c83922661864bf965ebceb774f3f8b2d8bed819 at cf0904e3). The
# mirror exists only because Palomar's verifier does not honor Lake `subDir`
# (PalomarRegistry/PalomarSubmission#190); the substantive formalization is the original.
version: "v0.4"

project:
  name: "OSreconstruction"
  description: >-
    A machine-checked proof of the Osterwalder-Schrader correspondence between Euclidean
    Schwinger functions and relativistic Wightman distributions, in both directions, for
    every spatial dimension d >= 1. The Euclidean side is a family of Schwinger functions on
    the zero-diagonal Schwartz space (OS II's test space) satisfying E0-E4; the relativistic
    side is a family of tempered distributions satisfying the Wightman function axioms
    (Poincare covariance, spectrum condition, locality, positivity, Hermiticity,
    clustering). They are linked by a Wick pairing: one holomorphic kernel on the forward
    tube whose boundary values give the Wightman distribution and whose restriction to Wick-
    rotated points gives the Schwinger function. Three theorems are verified: E'->R (OS
    axioms plus linear growth yield Wick-paired Wightman distributions); E'->R' in OS II's
    form (with growth E0' (4.1), the Wightman distributions exist, satisfy the output bound
    R0' (4.3), and are unique among Wick-paired families; the two growth conditions are
    proved equivalent); and R->E (every Wightman family yields, via an explicit constructor,
    Schwinger functions satisfying E0-E4, with no growth hypothesis). The asymmetry is OS
    II's correction of OS I and is reproduced faithfully: growth is assumed on the Euclidean
    side and not recovered, so the two directions do not compose to a biconditional. Scope:
    theorems about Wightman functions, not the GNS reconstruction of operators. Four
    conventions are weaker than the textbook ones and are visible in the Challenge: the
    forward tube carries the extra condition Im z_0 in the open forward cone; locality is
    stated for adjacent transpositions; reflection positivity goes through a totalized
    coercion onto zero-diagonal tests; growth is a hypothesis, not a conclusion. To our
    knowledge this is the first machine-checked proof of the OS reconstruction theorem; its
    audience is constructive and axiomatic QFT, where it is the bridge every Euclidean
    construction crosses. The companion formalization of the massive free field and the
    Proca Wick square inhabits its hypotheses.
  authors:
    - "Xi Yin"
    - "Michael R. Douglas"
    - "Anna Mei"
  responsible_maintainers: ["Xi Yin", "Michael R. Douglas"]   # CONFIRM
  license: "Apache-2.0"

