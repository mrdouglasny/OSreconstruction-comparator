fidelity:
  divergences: >
    Stated in the Challenge and in the package's docs/COMPARATOR_NOTE.html. The forward
    tube forwardTube adds Im z_0 in V_+ to the successive-difference conditions, a proper
    subset of the literal n-point tube; forwardAnalyticity and wickPair assert extension
    to this smaller tube only. Locality is adjacentLocality: commutation for neighbouring
    labels on spacelike-supported tests; adjacent transpositions generate S_n but the
    equivalence with full locality is not part of the statement. Reflection positivity
    osInnerProduct applies the total coercion ZeroTest.ofClassical, which sends a test
    failing the zero-diagonal condition to zero. The Euclidean growth condition is a
    hypothesis of the forward theorems and is not derived by the reverse theorem. The
    arity-linear growth of e_to_r and OS II's E0' of e_to_r_osii are proved equivalent
    (osiiOriginalLinearGrowth_iff) in the package, outside the compared statements.
    "Wightman" means the Wightman function axioms; no Hilbert space or field operators
    appear in the compared theorems.
  axiom_footprint: >
    Each compared theorem depends on exactly propext, Classical.choice and Quot.sound,
    enforced by comparator.json's permitted_axioms. The package contains no axiom
    declarations and no sorry outside the Challenge holes.

review:
  status: "self-assessed"
  reviewers: []
  notes: >
    The three sorries in Challenge.lean are the registry holes, discharged by
    Solution.lean through the package's bridge equivalences (eToR_iff, eToROSII_iff,
    rToE_iff) between the audit records and the production records. The package was
    developed in a shared repository with pull-request review among the authors.

