name = "OSReconstructionComparator"
version = "0.1.0"
defaultTargets = ["RegistryChallenge", "RegistrySolution"]

# The substantive development, pinned to an exact commit, through a root-level mirror of its
# os-reconstruction/ directory (git subtree split; identical tree hash) because Palomar's
# verifier does not honor Lake subDir (PalomarSubmission#190). Mathlib reaches the workspace
# through it, which is what lets RegistryChallenge.lean import Mathlib while importing no
# project source.
[[require]]
name = "OSReconstruction"
git = "https://github.com/mrdouglasny/os-reconstruction.git"
rev = "a63f143281ef1810f6acbf90f6959cf579639f1b"

# Module names must be unambiguous across the Lake workspace: the package itself ships
# libraries whose roots are `Challenge` and `Solution`, and Palomar resolves modules by name.
# The auditable statement: Mathlib-only imports, one `sorry` per advertised declaration.
[[lean_lib]]
name = "RegistryChallenge"
roots = ["RegistryChallenge"]

# The same declarations, proved from the package's Solution via its bridges.
[[lean_lib]]
name = "RegistrySolution"
roots = ["RegistrySolution"]
